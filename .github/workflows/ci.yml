name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc --noEmit && vite build`, so this covers
      # typechecking and the production bundle in one step.
      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test
